name: Java Calculator CI CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # JOB 1 - BUILD AND TEST
  job1_build:
    name: "Job 1 - Build and Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-calculator-jar
          path: target/*.jar

  # JOB 2 - DOWNLOAD ARTIFACT
  job2_download:
    name: "Job 2 - Download Artifact"
    runs-on: ubuntu-latest
    needs: job1_build

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-calculator-jar
          path: downloaded-jar

      - name: List downloaded files
        run: ls -lh downloaded-jar/
  # JOB 3 - DEPLOY
  job3_deploy:
    name: "Job 3 - Deploy"
    runs-on: ubuntu-latest
    needs: job2_download

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-calculator-jar
          path: deployment-package

      - name: Create deployment folder
        run: mkdir -p deployment

      - name: Copy JAR to deployment folder
        run: cp deployment-package/*.jar deployment/

      - name: Verify deployment package
        run: ls -lh deployment/

      - name: Deployment completed
        run: echo "Java Calculator deployment completed successfully!"

