
name: Java Calculator CI CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # JOB 1 - BUILD AND TEST
  job1_build:
    name: "Job 1 - Build and Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-calculator-jar
          path: target/*.jar

  # JOB 2 - DOWNLOAD ARTIFACT
  job2_download:
    name: "Job 2 - Download Artifact"
    runs-on: ubuntu-latest
    needs: job1_build

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-calculator-jar
          path: downloaded-jar

      - name: List downloaded files
        run: ls -lh downloaded-jar/

  # JOB 3 - DEPLOY
  job3_deploy:
    name: "Job 3 - Deploy"
    runs-on: ubuntu-latest
    needs: job2_download

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-calculator-jar
          path: deployment-package

      - name: Prepare deployment folder
        run: |
          mkdir -p deployment
          cp deployment-package/*.jar deployment/

      - name: Verify deployment package
        run: ls -lh deployment/

      - name: Deployment completed
        run: echo "Deployment completed successfully!"

  # JOB 4 - DOCKER BUILD AND PUSH
  job4_docker:
    name: "Job 4 - Docker Build and Push"
    runs-on: ubuntu-latest
    needs: job3_deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR
        run: mvn --batch-mode clean package -DskipTests

      - name: Login to Docker Hub 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.JAVA_CICD }}
          password: ${{ secrets.JAVA_TOKENCICD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ttgupta/java-calculator:latest
